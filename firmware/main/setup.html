<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EutherCommand · Wi-Fi</title>
<style>body{font:18px system-ui;background:#101820;color:#f0f5fa;max-width:440px;margin:40px auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0 20px;font:inherit;border-radius:8px}button{background:#8ee4c0;color:#102820;border:0}label{display:block}#status{white-space:pre-line}small{color:#bccbd7}</style>
<h1>EutherCommand</h1><p>Anslut till ditt Wi-Fi</p><small>Använd ett 2,4 GHz-nät med WPA2/WPA3-lösenord. Ingen molntjänst behövs.</small>
<form id="form"><label>Nätverksnamn (SSID)<input id="ssid" required maxlength="32" autocomplete="off"></label><label>Wi-Fi-lösenord<input id="password" type="password" required minlength="8" maxlength="63" autocomplete="off"></label><button id="submit">Anslut och spara</button></form><p id="status" role="status" aria-live="polite"></p>
<script>
const statusEl=document.querySelector('#status'),button=document.querySelector('#submit');
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();button.disabled=true;statusEl.textContent='Ansluter… Vänta kvar på den här sidan.';try{let r=await fetch('/configure',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':'%s'},body:JSON.stringify({ssid:document.querySelector('#ssid').value,password:document.querySelector('#password').value})});if(!r.ok)throw Error('Kunde inte starta. Kontrollera uppgifterna och försök igen.');document.querySelector('#password').value='';for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,1000));let s=await(await fetch('/status')).json();if(s.state==='saved'){statusEl.textContent='Ansluten och sparad! Adress: '+s.ip+'\nByt tillbaka till ditt vanliga Wi-Fi. Installationsnätet stängs nu. Trådlös IR-styrning är ännu inte aktiverad.';return;}if(s.state==='failed')throw Error('Anslutningen misslyckades. Kontrollera namn och lösenord.');}throw Error('Ingen bekräftelse. Återanslut till installationsnätet och försök igen.');}catch(err){statusEl.textContent=err.message;button.disabled=false;}};
</script></html>
